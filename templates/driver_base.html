<!DOCTYPE html>
<html lang="en" data-theme="classic" data-bs-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>{% block title %}Driver Portal{% endblock %}</title>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
<style>
.dp-top{background:var(--side);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.dp-top a,.dp-top button.lnk{color:#fff;text-decoration:none;background:none;border:0;padding:0;font-size:inherit;}
.dp-wrap{max-width:640px;margin:0 auto;padding:14px;}
.dp-tabs{display:flex;gap:8px;margin-bottom:12px;}
.dp-tabs a{flex:1;text-align:center;padding:10px 4px;border:2px solid var(--acc);border-radius:10px;font-weight:700;font-size:13px;text-decoration:none;color:var(--acc-txt);background:var(--card);}
.dp-tabs a.on{background:var(--acc);color:var(--acc-fg);}
.dp-card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.dp-head{background:var(--side);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px;}
.dp-body{padding:14px;}
.dp-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:2px;}
.dp-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid var(--acc);}
.dp-btn.solid{background:var(--acc);color:var(--acc-fg);}.dp-btn.solid:hover{background:var(--acc-h);color:var(--acc-fg);}
.dp-btn.line{background:var(--card);color:var(--acc-txt);}.dp-btn.line:hover{background:var(--acc);color:var(--acc-fg);}
.dp-btn[disabled]{opacity:.35;}
details.dp-more summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;}
.dp-items td{font-size:13px;padding:5px 0;border-bottom:1px solid var(--soft);vertical-align:top;color:var(--txt);}
.dp-filter{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:14px;}
.dp-chip{display:inline-block;padding:6px 12px;border:1.5px solid var(--acc);border-radius:20px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--acc-txt);background:var(--card);}
.dp-chip.on{background:var(--acc);color:var(--acc-fg);}
.dp-stop{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc-fg);font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.dp-step{border:1.5px solid var(--bd);border-radius:12px;padding:11px;margin-bottom:10px;}
.dp-step.active{border-color:var(--acc);}
.dp-step.locked{opacity:.55;}
.dp-step .dp-title{font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--acc-txt);margin-bottom:6px;}
.dp-pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:12px;border:1px dashed currentColor;}
</style>
{% block xh %}{% endblock %}
</head><body>
{% block body %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block xs %}{% endblock %}
</body></html>
