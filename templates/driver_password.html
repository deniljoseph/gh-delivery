{% extends 'driver_base.html' %}{% block title %}Change Password{% endblock %}
{% block body %}
<div class="dp-top"><a href="{{ url_for('driver_home') }}"><i class="bi bi-arrow-left me-2"></i>My deliveries</a><span style="font-weight:700;">Change password</span></div>
<div class="dp-wrap">
  {% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{ 'success' if cat=='success' else 'danger' }} py-2">{{ msg }}</div>{% endfor %}{% endwith %}
  <div class="dp-card"><div class="dp-body"><form method="POST">
    <label class="form-label">Current password</label><input type="password" name="current_password" class="form-control mb-3" required style="font-size:16px;padding:12px;">
    <label class="form-label">New password</label><input type="password" name="new_password" class="form-control mb-3" required minlength="6" style="font-size:16px;padding:12px;">
    <label class="form-label">Confirm new password</label><input type="password" name="confirm_password" class="form-control mb-3" required style="font-size:16px;padding:12px;">
    <button class="dp-btn solid" type="submit">Save password</button>
  </form></div></div>
</div>
{% endblock %}
